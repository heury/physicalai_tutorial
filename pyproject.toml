[project]
name = "physicalai-tutorial"
version = "0.1.0"
description = "《로봇 없이 시작하는 Physical AI 따라하기》 예제 코드"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    # ultralytics 는 opencv-python 을, lerobot 은 opencv-python-headless 를 요구해 둘 다 설치된다.
    # 둘 다 cv2 모듈을 제공하므로 같은 버전으로 묶어, 어느 쪽이 import 되든 결과가 같게 한다.
    "opencv-python==4.13.0.*",
    "opencv-python-headless==4.13.0.*",
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "lerobot[dataset,training,smolvla]>=0.6",
    "openai>=3.31.0",
]

# 9부에서만 필요합니다. 본편 1~8부는 이것 없이 전부 돌아갑니다.
#   uv pip install -e ".[llm]"   또는   uv pip install openai
[project.optional-dependencies]
llm = ["openai>=3.0"]

[tool.uv]
package = false
